# Docker Compose สำหรับการใช้งานบน Production / VLAN Deployment (ProjectLUMA)
services:
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AI_PROVIDER: ${AI_PROVIDER:-development-procedural}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required in production}
      STABLE_DIFFUSION_WEBUI_URL: ${STABLE_DIFFUSION_WEBUI_URL:-http://127.0.0.1:7860}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-engine:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required in production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/luma.db}
      DATA_ROOT: /data
      MEDIA_ROOT: /media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - luma-data:/data
      - luma-media:/media
    expose:
      - "5000"
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  luma-data:
    name: luma-prod-data
  luma-media:
    name: luma-prod-media
