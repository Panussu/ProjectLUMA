# Classroom LAN configuration. Update the root and backend address after
# confirming them on the actual computers.

upstream luma_backend {
    server 192.168.1.20:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name 192.168.1.10 localhost;

    # On Windows Nginx, use forward slashes in absolute paths.
    root C:/ProjectLUMA/frontend;
    index index.html;
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://luma_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://luma_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://luma_backend/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}

