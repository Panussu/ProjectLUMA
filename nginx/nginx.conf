# จำนวน worker และตำแหน่งบันทึกกับ PID ของ Nginx
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

# ขีดจำกัดการเชื่อมต่อของ worker แต่ละตัว

events {
    worker_connections 1024;
}

# ค่าพื้นฐาน HTTP ชนิดไฟล์ และการเชื่อมต่อค้าง

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # รูปแบบ access log พร้อมรหัสคำขอสำหรับติดตามข้ามบริการ

    log_format luma '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id_time';

    # ใช้รหัสจากคำขอถ้ามี หรือใช้รหัสที่ Nginx สร้าง

    map $http_x_request_id $request_id_time {
        default $http_x_request_id;
        "" $request_id;
    }

    # Includes are relative to this configuration file's directory.
    # โหลดเส้นทาง VLAN จากไฟล์ที่อยู่ข้าง nginx.conf
    include luma.conf;
}
