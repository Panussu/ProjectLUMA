# กำหนดที่อยู่ Flask ที่รับคำขอจาก reverse proxy
upstream luma_backend {
    server backend:5000;
    keepalive 16;
}

# ตั้งพอร์ตหน้าเว็บ โฟลเดอร์ไฟล์ และขนาดอัปโหลดสูงสุด

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    server_tokens off;

    # เพิ่มส่วนหัวควบคุมการตีความเนื้อหา การอ้างอิง และการแสดงในเฟรม

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ให้บริการหน้าเว็บและใช้ index.html เมื่อไม่พบเส้นทางไฟล์

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ส่ง API ไปยัง Flask โดยเก็บเส้นทางเดิม

    location /api/ {
        proxy_pass http://luma_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }

    # ส่งคำขอภาพไปตรวจสิทธิ์และอ่านไฟล์ที่ Flask

    location /media/ {
        proxy_pass http://luma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # แปลงจุดตรวจสุขภาพหน้าเว็บเป็น health ของ Flask

    location = /health {
        proxy_pass http://luma_backend/api/v1/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}

